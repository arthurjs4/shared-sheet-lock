[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-sheet-lock"
version = "0.1.0"
description = "Let two agents or machines share one .xlsx without trampling each other."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sheet-lock = "shared_sheet_lock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
